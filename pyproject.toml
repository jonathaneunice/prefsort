[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prefsort"
dynamic = ["version"]
description = "Sort an iterable while preferring selected values"
readme = "README.rst"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jonathan Eunice", email = "jonathan.eunice@gmail.com" },
]
keywords = ["preference", "sort", "sorting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jonathaneunice/prefsort"
Changelog = "https://github.com/jonathaneunice/prefsort/blob/main/CHANGELOG.md"
Issues = "https://github.com/jonathaneunice/prefsort/issues"
Source = "https://github.com/jonathaneunice/prefsort"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
quality = [
    "mypy>=1.15",
    "pre-commit>=4",
    "ruff>=0.11",
]
build = [
    "build>=1.2",
    "twine>=6",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
    { include-group = "build" },
]

[tool.setuptools.dynamic]
version = { attr = "prefsort.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prefsort = ["py.typed"]

[tool.ruff]
line-length = 108
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PT", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["prefsort"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.mypy]
files = ["src/prefsort", "tests"]
python_version = "3.11"
strict = true
warn_unreachable = true
